name: Run Python Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 👈 این خط بسیار مهم است! به شما اجازه می‌دهد خودتان دستی دکمه اجرا را بزنید.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lief # 👈 این خط را اضافه کنید تا کتابخانه LIEF نصب شود
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run script
      run: |
        python main.py "UNdUP2" # 👈 مسیر فایل را اینجا اضافه کنید
