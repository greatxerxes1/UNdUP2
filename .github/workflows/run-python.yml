name: Build Python to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # 👈 استفاده از سرور ویندوز برای ساخت فایل exe ویندوزی
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lief pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile main.py # 👈 تبدیل اسکریپت به یک فایل تک‌فایله EXE
        
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Windows-Executable
        path: dist/main.exe
