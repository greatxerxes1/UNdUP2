name: Build and Release EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # 👈 این دسترسی برای ایجاد ریلیز در اکانت شما ضروری است

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lief pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --name "UNdUP2_Tool" main.py # 👈 نام فایل خروجی را اینجا مشخص کردیم
        
    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/UNdUP2_Tool.exe"
        tag: "v1.0.${{ github.run_number }}" # هر بار یک نسخه جدید (مثلا v1.0.1) می‌سازد
        name: "Release v1.0.${{ github.run_number }}"
        body: "این فایل exe به صورت خودکار توسط گیت‌هاب اکشنز کامپایل شده است."
        token: ${{ secrets.GITHUB_TOKEN }}
